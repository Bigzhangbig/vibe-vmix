<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>纸飞机 · 深秋歌会决赛｜包装试映</title>
  <style>
    :root{--dark:#101922;--card:#131f2b;--line:#273c49;--muted:#a6b9c4;--paper:#ebf6f7;--accent:#9bedde;--counter:#7ca9b2;--serif:"Noto Serif CJK SC","Songti SC","SimSun",serif;--sans:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;--mono:Consolas,"SFMono-Regular",monospace}
    *{box-sizing:border-box}
    html{background:var(--dark);color:var(--paper);font-family:var(--sans)}
    body{margin:0}
    button{font:inherit;color:inherit;border:0;background:transparent;cursor:pointer}
    button:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
    .shell{width:min(1376px,100%);margin:auto;padding:0 clamp(16px,4vw,60px) 42px}
    .mast{display:flex;align-items:center;justify-content:space-between;padding:25px 0 18px;border-bottom:1px solid var(--line);gap:18px}
    .brand,.meta,.kicker,.minor,.count,.format{font:600 11px/1.35 var(--mono);letter-spacing:.11em;text-transform:uppercase}
    .brand{display:flex;align-items:center;gap:10px;text-transform:none;color:var(--paper)}
    .brand svg{width:16px;height:16px;display:block;fill:var(--accent);flex:none}
    .meta{color:var(--muted);text-align:right}
    .intro{padding:clamp(29px,4.5vw,61px) 0 27px;display:flex;align-items:end;justify-content:space-between;gap:24px}
    .kicker{margin:0 0 12px;color:var(--accent)}
    h1{margin:0;font:800 clamp(38px,6.2vw,82px)/1.12 var(--serif);letter-spacing:-.055em}
    .lead{margin:14px 0 0;font-size:14px;color:var(--muted);line-height:1.7}
    .tag{border:1px solid #3c6571;padding:10px 11px;color:var(--muted);white-space:nowrap;margin-bottom:4px}
    .monitor{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:15px;align-items:stretch}
    .screen{background:var(--card);border:1px solid var(--line);min-width:0}
    .topline,.footerline{height:42px;padding:0 13px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted)}
    .topline{border-bottom:1px solid var(--line)}
    .footerline{border-top:1px solid var(--line)}.footeractions{display:flex;gap:6px;white-space:nowrap}
    .topline .minor{color:var(--paper)}
    .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px;box-shadow:0 0 12px #9bedde74}
    .surface{aspect-ratio:16/9;position:relative;isolation:isolate;overflow:hidden;background:#091017}
    .surface[data-under="checker"]{background-color:#20262c;background-image:conic-gradient(#363d45 25%,transparent 0 50%,#363d45 0 75%,transparent 0);background-size:28px 28px}
    .surface canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
    .surface:not([data-under="stage"]) #stage{display:none}
    .rail{border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:15px;background:var(--card);min-width:0}
    .rail section+section{border-top:1px solid var(--line);padding-top:14px}
    .rail h2{font-size:13px;margin:0 0 9px;font-weight:690}
    .modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
    .choice{display:flex;align-items:center;gap:8px;min-height:36px;text-align:left;padding:7px 5px;color:var(--muted);border:1px solid transparent;font-size:12px}
    .choice:hover,.toggle:hover,.ghost:hover{background:#203748;color:var(--paper)}
    .choice[aria-pressed="true"]{color:var(--paper);border-color:#417378;background:#203b43}
    .choice .count{color:var(--counter);min-width:15px;font-size:10px}
    .toggles{display:flex;flex-wrap:wrap;gap:4px}
    .toggle{flex:1;min-width:63px;text-align:center;font-size:12px;padding:7px 5px;min-height:36px;border:1px solid var(--line);color:var(--muted)}
    .toggle:disabled{opacity:.35;cursor:default}.toggle[aria-pressed="true"]{border-color:#6c9e9b;color:var(--paper);background:#1e3c49}
    .ghost{border:1px solid var(--line);padding:5px 8px;font-size:12px}
    .rail .hint{margin:8px 0 0;font-size:11px;line-height:1.6;color:var(--muted)}
    .info{font-size:11px;color:var(--muted);margin:14px 0 0;line-height:1.65}
    #error{border:1px solid #986a52;background:#3a2625;color:#ffe8d8;padding:12px;font-size:14px}
    html[data-preview="frame"] .mast,html[data-preview="frame"] .intro,html[data-preview="frame"] .rail,html[data-preview="frame"] .info{display:none}
    html[data-preview="frame"] .monitor{display:block}
    html[data-preview="frame"] .shell{width:min(1600px,100%);padding:clamp(8px,2vw,26px)}
    @media(max-width:850px){.monitor{grid-template-columns:1fr}.rail{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}.rail section+section{border:0;padding:0}.modes{grid-template-columns:repeat(2,minmax(0,1fr));gap:2px}.rail section:last-child{grid-column:2}.intro{align-items:start}.tag{margin-top:6px}}
    @media(max-width:600px){.mast{padding:17px 0 13px}.intro{display:block;padding-top:25px}.tag{display:none}.rail{grid-template-columns:1fr 1fr;padding:10px}.modes{grid-template-columns:1fr}.rail section:first-child{grid-row:span 2}.topline,.footerline{padding:0 8px}.format{font-size:9px}.lead{font-size:12px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="mast"><div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1 14 9 23 12 14 15 12 23 10 15 1 12 10 9Z"/></svg> 北京理工大学 · 深秋歌会</div><div class="meta">现场视觉 / VISUAL TOOLKIT</div></header>
    <div class="intro">
      <div><p class="kicker">第 50 届决赛 / CONCERT GRAPHICS</p><h1>纸飞机 · 包装试映</h1><p class="lead">切换八种演出画面。居中构图和靠下叠画都保留透明区域，可直接盖在舞台机位上。</p></div>
      <div class="tag minor">16:9 &nbsp;·&nbsp; 1920 × 1080</div>
    </div>
    <p id="error" hidden role="alert">没有加载到包装渲染器。请使用独立离线版，或保持此文件在项目的原目录。</p>
    <div class="monitor">
      <section class="screen" aria-label="包装预览">
        <header class="topline"><span class="minor"><i class="dot"></i>画面预览 / PREVIEW</span><span class="format" id="sceneName" aria-live="polite"></span></header>
        <div class="surface" id="surface" data-under="checker">
          <canvas id="stage" width="1920" height="1080" aria-hidden="true"></canvas>
          <canvas id="preview" width="1920" height="1080" aria-label="当前包装效果"></canvas>
        </div>
        <footer class="footerline"><span class="format" id="frameInfo"></span><span class="footeractions"><button class="ghost" id="replay" type="button">重播</button><button class="ghost" id="solo" type="button" aria-pressed="false">只看画面</button></span></footer>
      </section>
      <aside class="rail" aria-label="试映控件">
        <section><h2>画面类型</h2><div class="modes" id="modes"></div></section>
        <section><h2>构图位置</h2><div class="toggles" id="formats"></div><p class="hint" id="formatHint">两种构图都保留透明边缘。</p></section>
        <section><h2>预览底图</h2><div class="toggles" id="underlays"></div><p class="hint">底图只用来检查透明效果，不属于输出。</p></section>
      </aside>
    </div>
    <p class="info">试映使用演示名单、文案与模拟舞台底图，不含原始录像。</p>
  </main>
  <!-- INLINE_RENDERER:BEGIN -->
  <script src="../../ui/stage/concert-graphics.js"></script>
  <!-- INLINE_RENDERER:END -->
  <script>
    (() => {
      'use strict';
      if (!window.StageGraphics) { document.getElementById('error').hidden=false; return; }
      const $=id=>document.getElementById(id);
      const modes=[
        {id:'title',name:'节目报幕'},{id:'lyrics',name:'歌词'},{id:'rank',name:'名次'},
        {id:'guest',name:'嘉宾介绍'},{id:'contestant',name:'选手介绍'},
        {id:'award',name:'奖项揭晓'},{id:'bug',name:'画面角标'},{id:'finaleCast',name:'决赛阵容'}
      ];
      const fixedAnchors={lyrics:'歌词区',bug:'右下角'};
      const formats=[{id:'center',name:'居中构图'},{id:'lower',name:'靠下叠画'}];
      const underlays=[{id:'checker',name:'棋盘格'},{id:'stage',name:'舞台'}];
      const base={show:'深秋歌会',title:'秋日回声',name:'林晓',subtitle:'走过这一季的风',credits:'作词 / 演示  ·  作曲 / 演示',full:true};
      const cues={
        title:{...base,subtitle:'深秋歌会 · 现场演出'},
        lyrics:{...base,lyrics:'让晚风替我轻轻唱',lyric2:'把未写完的故事交给月光'},
        rank:{...base,title:'荣耀时刻',subtitle:'深秋歌会 · 竞演结果',ranks:[{rank:'01',name:'林晓',score:'98.60'},{rank:'02',name:'陈予安',score:'97.35'},{rank:'03',name:'许知远',score:'95.80'}]},
        guest:{...base,name:'陈予安',subtitle:'演唱嘉宾 · 特别演出'},
        contestant:{...base,name:'林晓',number:'07',subtitle:'未来精工技术学院 · 独唱'},
        award:{...base,title:'最佳人气奖',name:'陈予安',subtitle:'现场投票 · 862 票'},
        bug:{...base,title:'第 50 届 · 决赛',full:false},
        finaleCast:{...base,title:'六强阵容',subtitle:'深秋歌会 · 决赛之夜',ranks:[
          {name:'林晓',score:'01 / 独唱'},{name:'陈予安',score:'02 / 独唱'},
          {name:'许知远',score:'03 / 独唱'},{name:'江宁',score:'04 / 独唱'},
          {name:'程望舒',score:'05 / 独唱'},{name:'苏南',score:'06 / 独唱'}
        ]}
      };
      let mode='title',format='center',under='checker',raf=0;
      const media=window.matchMedia?.('(prefers-reduced-motion: reduce)');
      const preview=$('preview'), context=$('stage').getContext('2d');
      const buttons={};
      function add(group,data,onChange,css='choice'){
        buttons[group]=[];
        data.forEach((item,i)=>{
          const b=document.createElement('button');
          b.type='button';b.className=css;b.dataset.id=item.id;b.setAttribute('aria-pressed','false');
          if(css==='choice'){
            const n=document.createElement('span');n.className='count';n.textContent=String(i+1).padStart(2,'0');b.append(n);
          }
          const label=document.createElement('span');label.textContent=item.name;b.append(label);
          $(group).append(b);buttons[group].push(b);b.onclick=()=>onChange(item.id);
        });
      }
      function stage(){
        const c=context,W=1920,H=1080;
        const bg=c.createLinearGradient(0,0,0,H);
        bg.addColorStop(0,'#100c20');bg.addColorStop(.57,'#272041');bg.addColorStop(1,'#100a19');
        c.fillStyle=bg;c.fillRect(0,0,W,H);
        [215,515,835,1135,1425,1730].forEach((x,i)=>{
          const to=(i%2?x-235:x+230), fade=c.createLinearGradient(x,0,to,800);
          fade.addColorStop(0,i%3?'#9474f65b':'#f09d6777');fade.addColorStop(1,'#9973ff00');
          c.fillStyle=fade;c.beginPath();c.moveTo(x-10,5);c.lineTo(x+13,5);c.lineTo(to+143,910);c.lineTo(to-146,910);c.fill();
          c.beginPath();c.arc(x,45,8,0,Math.PI*2);c.fillStyle=i%3?'#b394ff':'#ffd5a1';c.fill();
        });
        for(let row=0;row<3;row++){
          const y=943+row*58;c.fillStyle=['#1a1225','#120e1a','#0e0c14'][row];
          for(let i=0;i<35;i++){
            const x=i*61+(row%2)*29,sz=11+(i*11%14);
            c.beginPath();c.ellipse(x,y-(i*13%34),sz,sz*1.22,0,0,Math.PI*2);c.fill();
            c.fillRect(x-sz,y-12,sz*2,H-y+15);
          }
        }
      }
      function anchored(){return Object.hasOwn(fixedAnchors,mode);}
      function cue(){return {...cues[mode],type:mode,theme:'finale50',full:!anchored()&&format==='center'};}
      function render(t=2.5){window.StageGraphics.render(preview,cue(),{time:t});}
      function replay(){
        cancelAnimationFrame(raf);
        if(media?.matches){render();return;}
        const start=performance.now();
        const tick=now=>{const t=(now-start)/1000;render(t);if(t<2.5)raf=requestAnimationFrame(tick);};
        raf=requestAnimationFrame(tick);
      }
      function select(group,id){(buttons[group]||[]).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===id)));}
      function update(){
        cancelAnimationFrame(raf);
        const scene=modes.find(row=>row.id===mode), fixed=anchored();
        select('modes',mode);select('formats',fixed?'':format);select('underlays',under);
        buttons.formats.forEach(b=>{b.disabled=fixed;});
        $('formatHint').textContent=fixed?'固定位置：'+fixedAnchors[mode]+'。':'居中或靠下，四周都保留透明。';
        $('sceneName').textContent=scene.name;
        $('frameInfo').textContent='1920 × 1080 · ALPHA';
        $('surface').dataset.under=under;
        render();
      }
      add('modes',modes,id=>{mode=id;update();});
      add('formats',formats,id=>{format=id;update();},'toggle');
      add('underlays',underlays,id=>{under=id;update();},'toggle');
      stage();update();
      $('replay').onclick=replay;
      let solo=false;
      $('solo').onclick=()=>{
        solo=!solo;
        document.documentElement.dataset.preview=solo?'frame':'gallery';
        $('solo').setAttribute('aria-pressed',String(solo));
        $('solo').textContent=solo?'返回试映':'只看画面';
      };
      document.fonts?.ready.then(()=>{update();});
    })();
  </script>
</body>
</html>
